# SUC (k3s-upgrade) sends SIGTERM to k3s and relies on the supervisor to
# restart it. Restart=on-failure treats SIGTERM as a clean exit and does NOT
# restart (verified on this fleet 2026-09-16). Restart=always matches the
# upstream k3s systemd unit and makes k3s-upgrade work.
[Service]
Restart=always
RestartSec=5
