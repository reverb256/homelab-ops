# Trim MagicDNS's default-route claim (t_d47a5575, outcome E).
#
# tailscaled (CorpDNS=true) registers the tailscale0 link with routing domains
# "tigris-ule.ts.net lan ~." — the trailing ~. makes systemd-resolved spread
# ordinary queries across ALL default-route links, so a fraction of host
# lookups went to MagicDNS (100.100.100.100) and BYPASSED Pi-hole entirely
# (measured 2026-10-15: `getent doubleclick.net` flapped 0.0.0.0 / real-IP on
# nexus and sentry). The ts.net + lan domains stay — MagicDNS is still the
# resolver for tailnet hostnames — but ~. must go so the global triad
# (10.1.1.53 pihole, 10.1.1.100 unbound VIP, 10.1.1.120 nexus unbound) owns
# default-route resolution.
#
# This is deliberately a trim, not a disable: `tailscale up --accept-dns=false`
# would remove the ts.net zone too and break tailnet name resolution (unbound
# cannot answer MagicDNS names — its public ts.net forwarder NXDOMAINs them,
# measured live). resolvectl domain is idempotent and re-runs safely every
# start; tailscaled re-asserts its own config on restart, which is exactly when
# this ExecStartPost re-trims. Exit 0 always: a DNS-domain trim must never
# mark tailscaled failed.
[Service]
ExecStartPost=/bin/bash -c 'for i in $(seq 1 30); do resolvectl domain tailscale0 "tigris-ule.ts.net" "lan" >/dev/null 2>&1 && exit 0; sleep 2; done; exit 0'
