[Resolve]
# DNS contract (t_d47a5575, outcome E). The server list lives in the MAIN
# /etc/systemd/resolved.conf on zephyr (written by `omarchy dns Custom` — the
# omarchy-dns tool owns all three layers on this host and REWRITES the main
# file, so a DNS= list here would fight it). This drop-in adds what the tool
# does not: route ALL domains through the global list (~.), and public
# resolvers as a true last resort. systemd-resolved never uses FallbackDNS
# while any primary DNS= is set — the primaries themselves are the failover:
# pihole (.53) dies -> unbound VIP (.100) -> nexus unbound (.120) -> public.
Domains=~.
FallbackDNS=1.1.1.1 8.8.8.8
