# /etc/updatedb.conf -- managed by homelab-ops/omarchy/<host>, do not hand-edit.
#
# WHY THE POOL IS PRUNED (2026-09-22)
#   On nexus, plocate-updatedb walked /data/media: the 3.2 TiB bcache0 pool whose
#   dead extents HANG reads. Measured on 2026-09-22: the scheduled run started
#   00:30:37 and was still running 12h09m later when it was killed by TERM, and the
#   on-disk index was still the one from the previous day. A whole-filesystem scan
#   that never finishes also pins the pool at 100% util (r_await in the tens of ms
#   for ~2 MB/s of 16 KiB reads), which is what exhausted the retry budget of
#   media-config-backup.service (30 attempts, "sync attempt 30 failed ... retrying
#   in 90s", failed 12:38:57) on the same day.
#
#   Nothing needs a locate index of the media/backup pool: it is served by the
#   *arr apps and Garage, not by filename lookups. Index the OS, /home and the
#   small config volumes instead.
#
#   Removed from the index (all on bcache0 unless noted):
#     /data/media /data/shared /data/games /data/backups /data/oldhome
#     /data/models /data/fast (staging), /var/lib/rancher (containerd + etcd WAL),
#     /mnt (old installs, CIFS).
PRUNE_BIND_MOUNTS = "no"
PRUNEFS = "9p afs anon_inodefs auto autofs bdev binfmt_misc cgroup cifs coda configfs cpuset cramfs debugfs devpts devtmpfs ecryptfs ecryptfs exofs ftpfs fuse fuse.encfs fuse.s3fs fuse.sshfs fusectl gfs gfs2 hugetlbfs inotifyfs iso9660 jffs2 lustre mqueue ncpfs nfs nfs4 nfsd pipefs proc ramfs rootfs rpc_pipefs securityfs selinuxfs sfs shfs smbfs sockfs sshfs sysfs tmpfs ubifs udf usbfs vboxsf overlay"
PRUNENAMES = ".git .hg .svn .snapshots node_modules .venv __pycache__"
PRUNEPATHS = "/.snapshots /afs /media /mnt /net /sfs /tmp /udev /var/cache /var/lib/pacman/local /var/lib/rancher /var/lock /var/run /var/spool /var/tmp /data/backups /data/fast /data/games /data/media /data/models /data/oldhome /data/shared"
