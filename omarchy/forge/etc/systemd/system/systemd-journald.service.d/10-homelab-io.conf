# Keep journald's writes out of the way of etcd's WAL on hosts where both share
# one device (forge: /dev/mapper/root = sdb2 LUKS; nexus: /dev/mapper/root = nvme0n1p2).
#
# Evidence: etcd_disk_wal_fsync_duration_seconds p99 hit 7.5s on forge while
# /var/log/journal writeback ran against the same device (see the journald.conf.d
# drop-in for the full numbers). journald is pure bookkeeping, so it yields.
#
# Managed by homelab-ops/omarchy/<host> -- do not hand-edit on the host.
[Service]
IOSchedulingClass=idle
IOSchedulingPriority=7
Nice=10
