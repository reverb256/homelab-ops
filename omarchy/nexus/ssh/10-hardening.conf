# Managed by homelab-ops/omarchy/nexus — do not hand-edit on the host.
# Installed by apply.sh to /etc/ssh/sshd_config.d/10-hardening.conf
#
# Arch's stock sshd_config leaves PasswordAuthentication commented out, so
# OpenSSH's built-in default (yes) applies and sshd advertises
# "publickey,password". Verified 2026-08-23: nexus offered password auth to any
# tailnet peer. The pre-migration NixOS config set this to no explicitly; that
# hardening was lost in the reinstall.
#
# The filename must sort BEFORE 99-archlinux.conf. OpenSSH takes the FIRST
# value seen for a keyword, so a later file cannot override an earlier one.

# Keys only. Tailscale SSH does not use these settings — it runs its own
# server on tailnet:22 — so this only governs the OpenSSH fallback path.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Root cannot log in directly; use j_kro + sudo.
PermitRootLogin no
