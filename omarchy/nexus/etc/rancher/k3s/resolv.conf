# Managed by homelab-ops — source: omarchy/<host>/etc/rancher/k3s/resolv.conf
# DO NOT hand-edit on the host. Edit the repo copy, commit, then
#   scripts/apply-k3s-resolv-conf.sh <host>
#
# PURPOSE
#   This is the file the kubelet copies into every pod's /etc/resolv.conf, and
#   therefore the upstream CoreDNS forwards cache misses to (the k3s Corefile ends
#   with "forward . /etc/resolv.conf"). It is wired in by
#   config.yaml.d/10-resolv-conf.yaml -> `resolv-conf:`. k3s skips its own
#   viability check for a manually specified file (docs.k3s.io/advanced), so this
#   content is used verbatim, on every node, forever.
#
# WHY THIS FILE EXISTS (kanban t_02f7d489; incident t_53727458)
#   With no `resolv-conf`, each node's kubelet picks its own upstream — it probes
#   /etc/resolv.conf, then /run/systemd/resolve/resolv.conf, and falls back to a
#   generated stub when both hold loopback/multicast/link-local nameservers. The
#   four nodes disagreed (measured 2026-10-05):
#     nexus, sentry -> both files hold loopback (127.0.0.53 / 127.0.0.1) -> k3s
#                      generated a stub with 8.8.8.8 + 2001:4860:4860::8888, so
#                      pods and CoreDNS BYPASSED Pi-hole entirely.
#     forge         -> /run/systemd/resolve/resolv.conf holds 10.1.1.53 only, so
#                      the kubelet picked the Pi-hole LoadBalancer IP — which is
#                      DROPPED for pod traffic: pihole-dns is
#                      externalTrafficPolicy=Local with a single endpoint on
#                      sentry-agent, so kube-proxy installs a
#                      KUBE-EXTERNAL-SERVICES "has no local endpoints" DROP on
#                      nexus, forge and zephyr. Any CoreDNS replica landing on
#                      forge then SERVFAIL-flooded every cache miss (1.7k-12k/h,
#                      measured 2026-10-03) and kube-dns round-robin broke ~half of
#                      all cluster lookups (ArgoCD: "server misbehaving").
#     zephyr        -> /etc/resolv.conf holds 1.1.1.1 -> pods bypassed Pi-hole.
#
# WHY A ClusterIP AND NOT THE LOADBALANCER IP
#   10.43.77.126 is the pihole-dns Service ClusterIP. kube-proxy DNATs it to the
#   pihole pod, so it is reachable from a pod on EVERY node (measured 5/5 on nexus,
#   forge and sentry, 2026-10-05) and it keeps Pi-hole filtering for cluster
#   lookups. 10.1.1.53 stays as it is: externalTrafficPolicy=Local there preserves
#   client IPs for LAN clients, and flipping it to Cluster is a j_kro decision, not
#   a side effect of this file.
#
# DO NOT put loopback (127.x / ::1), link-local, multicast or 8.8.8.8 here: a
# loopback entry is what makes a pod resolve against itself, and 8.8.8.8 is the
# bypass this file exists to remove.
#
# ROLLBACK (per host)
#   rm -f /etc/rancher/k3s/config.yaml.d/10-resolv-conf.yaml
#   systemctl restart k3s            # zephyr: k3s-agent
#   kubectl -n kube-system delete pod -l k8s-app=kube-dns
#   -> the kubelet goes back to probing /etc/resolv.conf and
#      /run/systemd/resolve/resolv.conf on its own.
nameserver 10.43.77.126
