# etcd tuning for a disk that is shared with container churn.
#
# WHY (measured 2026-09-22, forge):
#   etcd_disk_wal_fsync_duration_seconds p99   0.11s (baseline) -> 7.52s (18:10Z)
#   etcd_disk_backend_commit_duration_seconds p99 -> 3.36s  (etcdHighCommitDurations, firing since 18:02Z)
#   journal: "slow fdatasync took 16.9s", "waiting for ReadIndex response took too long"
#   k3s.service: Main process exited, code=exited, status=1/FAILURE  (18:09:00Z)
#   -> Node forge NotReady 18:09:26Z, recovered ~18:15Z
#
# Defaults are heartbeat-interval=100ms / election-timeout=1000ms, which assume
# sub-100ms fsync. On this hardware a shared-disk write burst can blow past that
# and cost the member its leadership for no reason other than I/O latency.
# etcd's documented tuning for slow storage is to scale both up together
# (election-timeout should be >= 10x heartbeat-interval).
#
# 250/2500 tolerates a ~2s stall instead of ~1s without changing quorum
# requirements: it only makes spurious leader loss less likely, it does not slow
# down a genuine failure decision beyond the documented bound.
#
# Managed by homelab-ops/omarchy/<host> -- do not hand-edit on the host.
# ---- HISTORY (2026-10-14, kanban t_e13e4db4) ----
# This key was DEAD from 2026-09-22 to 2026-10-14: k3s skipped it with
# "Unknown flag --etcd-arg found in config.yaml, skipping", and the running
# etcd reported the defaults ("heartbeat-interval":"500ms","election-timeout":"5s").
# The slow-fsync mitigation described above was NEVER applied via this file --
# on the very host it was written for.
# 2026-09-25..26: the mitigation moved to the k3s UNITS (each host unit's
# ExecStart now carries --etcd-arg heartbeat-interval=250 / election-timeout=2500,
# verified live 2026-10-14: nexus + forge + sentry raft logs all report
# "heartbeat-interval":"250ms"). This file keeps the etcd-arg key ONLY as a
# documented dead key: removing it would lose the record of what was tried
# and why the units carry the flags now. Do NOT expect this key to work.
# See runbooks/k3s-rename-sentry-20260923/PLAN.md and
# runbooks/garage-k3s-etcd-key-missing-2026-10-05.md.
etcd-arg:
  - heartbeat-interval=250
  - election-timeout=2500
