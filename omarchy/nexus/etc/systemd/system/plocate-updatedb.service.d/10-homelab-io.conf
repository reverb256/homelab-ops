# plocate's daily updatedb walks the ENTIRE filesystem, including
# /var/lib/rancher/k3s (containerd 24G + etcd WAL) on hosts where that lives on
# the same device as etcd. It is a pure convenience index, so it runs at idle
# I/O class and low niceness and must never delay the control plane.
#
# Measured 2026-09-22: forge's etcd WAL fsync p99 spiked to 7.5s and the node
# went NodeNotReady while its single LUKS SSD was saturated by non-etcd writers.
# Never let a background indexer be one of them.
#
# Managed by homelab-ops/omarchy/<host> -- do not hand-edit on the host.
[Service]
IOSchedulingClass=idle
IOSchedulingPriority=7
Nice=19
