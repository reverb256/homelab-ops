[Resolve]
# Pi-hole first, then the unbound pair as LIVE secondaries (t_d47a5575).
# Why: systemd-resolved never uses FallbackDNS while any primary DNS= is set,
# so "DNS=10.1.1.53 + FallbackDNS=..." was NOT a fallback - a dead Pi-hole
# stalled every lookup (incident 2026-10-14 14:15-14:55 CDT). Listing the
# unbound pair here makes failover real: an outage degrades to UNFILTERED
# DNS instead of to no DNS. Public resolvers stay as true last resort.
DNS=10.1.1.53 10.1.1.100 10.1.1.120
FallbackDNS=1.1.1.1 8.8.8.8
Domains=~.
