# Reduce control-plane disk contention from container-log ingestion.
#
# WHY (measured 2026-09-22): forge's etcd WAL lives on the SAME LUKS/btrfs device
# (/dev/mapper/root on sdb2) as /var/log/journal. During a cluster-wide pod-churn
# burst (187 container starts in 19 min, Longhorn/CSI rollout at 17:51-18:02Z)
# journald's container-log ingestion and kubelet's writes saturated that device:
#   node_disk_io_time  sdb 11% -> 99.8%   (18:04Z -> 18:09Z)
#   node_disk_io_time_weighted aqu-sz spike 820
#   etcd_disk_wal_fsync_duration_seconds p99 0.11s -> 7.5s
#   etcd_disk_backend_commit_duration_seconds p99 -> 3.36s (etcdHighCommitDurations)
# which cost etcd its raft read-index/leader, k3s exited(1) and forge went
# NodeNotReady 18:09:26Z-18:15Z.
#
# Journal contents are never latency-critical; they must never hold the device
# that serialises etcd's fdatasync. Cap the total size, bound the write burst and
# push the writes behind everything else.
#
# Managed by homelab-ops/omarchy/<host> -- do not hand-edit on the host.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemMaxFileSize=128M
SystemKeepFree=2G
MaxRetentionSec=14day
Compress=yes
# Sync (not always) so unrelated log lines coalesce into fewer device flushes.
SyncIntervalSec=15s
# Absorb a pod-churn burst without dropping to a slow per-message path.
RateLimitIntervalSec=30s
RateLimitBurst=5000
