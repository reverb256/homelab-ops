# Declared source of truth: homelab-ops/omarchy/nexus/unbound/local-dns.conf
# Apply with: scripts/apply-dns.sh   (diff-checked, reloads unbound)
# /etc/unbound/local-dns.conf on nexus and sentry are copies of this file.
# /etc/unbound/local-dns.conf — UNIFIED across cluster
# Host records
local-data: "zephyr.lan. IN A 10.1.1.110"
local-data: "nexus.lan. IN A 10.1.1.120"
local-data: "forge.lan. IN A 10.1.1.130"
local-data: "sentry.lan. IN A 10.1.1.140"

# Local reverse zones (prevent leaking PTR queries)
local-zone: "10.in-addr.arpa." static
local-zone: "168.192.in-addr.arpa." static
local-zone: "16.172.in-addr.arpa." static

# dashboard.lan — team dashboard
local-data: "dashboard.lan. IN A 10.1.1.100"
local-data: "content.lan. IN A 10.1.1.100"

# media.lan — arr stack reverse proxy
local-data: "media.lan. IN A 10.1.1.100"

