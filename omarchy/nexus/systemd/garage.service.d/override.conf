# Managed by homelab-ops/omarchy/nexus — do not hand-edit on the host.
#
# Arch's packaged garage.service is fine as-is except for two things:
#   1. it does not know the data lives on the bcache pool, so it can start
#      before /data/shared is mounted and then create empty meta/data dirs on
#      the root filesystem — silently orphaning the real 274G object store;
#   2. it has no ordering against the mount unit at all.
#
# Requires= (not just After=) is deliberate: if the pool fails to mount,
# garage must NOT start. A garage that starts against a missing data_dir looks
# healthy while serving nothing.

[Unit]
RequiresMountsFor=/data/shared
After=data-shared.mount
Requires=data-shared.mount

[Service]
# Arch's unit hardcodes -c /etc/garage.toml, which is what apply.sh renders.
# Restated here so the intent is visible next to the ordering fix.
ExecStart=
ExecStart=/usr/bin/garage -c /etc/garage.toml server

# The packaged unit sets NoNewPrivileges only. Add the cheap hardening that
# does not interfere with garage needing read/write on the pool.
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ReadWritePaths=/data/shared/garage /var/lib/garage
ReadOnlyPaths=/etc/garage.toml
RestrictRealtime=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
