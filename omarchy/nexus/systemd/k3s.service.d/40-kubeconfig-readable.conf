# 40-kubeconfig-readable.conf — keep /etc/rancher/k3s/k3s.yaml readable by the
# admin group across k3s restarts.
#
# INCIDENT 2026-10-14: the 15:32 k3s restart rewrote k3s.yaml as 0600 root:root.
# Every lane that reads that path then failed with
#   error loading config file "/etc/rancher/k3s/k3s.yaml": permission denied
# so media-mcp-health.sh resolved nothing and reported all six media services as
# "not found in ns/media"; the media-mcp-health cron job failed, and
# tools/stack_sentinel.py in ~/Work/trading surfaced it as
#   SENTINEL-RED: cron streak: FAIL profilarr -> service profilarr not found in ns/media
# The stack was healthy the whole time — only the credential file's mode moved.
#
# k3s writes the file itself on every start, so a one-off `chmod` is reverted at
# the next restart (this is why the failure appeared out of nowhere). Re-apply
# group-read after each start. wheel contains only j_kro on nexus, so 0640 does
# not widen access beyond the admin user; the '-' prefix keeps a failed chmod
# from failing the unit.
#
# Installed by the nexus apply.sh drop-in loop (systemd/*.service.d/*.conf ->
# /etc/systemd/system/<unit>.d/); before 2026-10-14 it sat at systemd/ top level,
# which no apply.sh glob deployed and drift-check D9 mapped to a nonexistent
# top-level path — the same defect class fixed for 30-etcd-fasttier.conf
# (kanban t_e13e4db4).
# Verified by scripts/verify/k3s-kubeconfig-readable.sh.
[Service]
ExecStartPost=-/bin/sh -c '[ -f /etc/rancher/k3s/k3s.yaml ] || sleep 20; chgrp wheel /etc/rancher/k3s/k3s.yaml; chmod 0640 /etc/rancher/k3s/k3s.yaml'
