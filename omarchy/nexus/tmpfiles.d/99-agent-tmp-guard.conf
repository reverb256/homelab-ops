# Managed by homelab-ops/omarchy/nexus — do not edit on the host.
#
# /tmp on nexus is a 24G tmpfs, i.e. RAM, not disk. It reached 82% (19.1G) on
# 2026-09-22 from abandoned build artifacts alone: trading image exports
# (3.8G + 3.7G + 3.3G), a 2.5G pip-unpack of torch/cudnn wheels, rustfs
# backups (1.8G) and eight ~305M quay/quill tars. Reclaiming them returned
# 18.5G of RAM to a box running k3s + trading + miners.
#
# Two failure modes this prevents:
#   1. The tmpfs fills and starves the box of RAM.
#   2. A large save written to /tmp truncates when it hits the limit, and the
#      truncated file is then misread as a corrupt container layer.
#      Write big artifacts to ~/Work/trading/data/images/ instead.
#
# Age out anything untouched for 2 days. Arch's default is 10d; /etc wins.
d /tmp 1777 root root 2d
