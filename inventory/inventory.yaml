# Homelab inventory — single source of truth for FACTS about the fleet.
#
# Boundaries (never duplicate these here):
#   secrets         -> Bitwarden Secrets Manager (machine-internal; sops on VPS)
#   .lan DNS        -> omarchy/nexus/unbound/local-dns.conf (+ scripts/apply-dns.sh)
#   service configs -> their own repos/charts (media-k8s, mining-k8s, quill, ...)
#
# Render: bin/inventory-render   Validate: bin/inventory-validate
